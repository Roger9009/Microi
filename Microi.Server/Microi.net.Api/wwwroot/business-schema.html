<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>业务开发模块 · Microi 业务底座</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f7fa; }
    #app { height: 100%; }
    .topbar { display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #ebeef5; }
    .topbar .title { font-weight: 600; font-size: 16px; margin-right: 16px; color: #303133; }
    .layout { display: flex; height: calc(100% - 57px); }
    .sider { width: 280px; background: #fff; border-right: 1px solid #ebeef5; overflow: auto; }
    .content { flex: 1; overflow: auto; padding: 16px; }
    .doc-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
    .doc-item:hover { background: #f5f7fa; }
    .doc-item.active { background: #ecf5ff; color: #409eff; }
    .doc-item .sub { font-size: 12px; color: #909399; }
    .table-card { margin-bottom: 16px; }
    .role-tag { margin-left: 8px; }
    .muted { color: #909399; }
    .field-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field-form .full { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <span class="title">业务底座管理</span>
      <el-tag type="success" size="small" style="margin-right:4px" v-if="bizToken">
        {{ bizOsClient || 'default' }} · 已登录
      </el-tag>
      <el-input v-model="osClient" placeholder="OsClient(租户,可空)" style="width:160px" size="small" v-if="!bizToken" />
      <el-input v-model="token" placeholder="Microi Authorization Token" style="width:280px" size="small" show-password v-if="!bizToken" />
      <el-button type="primary" size="small" @click="loadDocuments">连接 / 刷新</el-button>
      <el-button size="small" @click="gotoDocument">单据保存</el-button>
      <el-button size="small" type="warning" @click="gotoLogin">切换账号</el-button>
      <span class="muted" style="font-size:12px" v-if="!bizToken">支持 bizadmin 无感登录：先访问 business-login.html</span>
    </div>

    <div class="layout">
      <div class="sider">
        <div v-for="d in documents" :key="d.MasterTable"
             :class="['doc-item', { active: current && current.MasterTable === d.MasterTable }]"
             @click="openDocument(d.MasterTable)">
          <div>{{ d.Label }}
            <el-tag v-if="!d.Exists" type="warning" size="small">未建表</el-tag>
          </div>
          <div class="sub">{{ d.MasterTable }} · 明细 {{ d.DetailCount }} · 扩展 {{ d.ExtensionCount }}</div>
        </div>
        <el-empty v-if="documents.length === 0" description="暂无文档，请先连接" :image-size="60" />
      </div>

      <div class="content" v-loading="loading">
        <template v-if="schema">
          <div style="margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <h2 style="margin:0">{{ schema.Label }} <span class="muted" style="font-size:13px">{{ schema.MasterTable }}</span></h2>
            <el-button type="primary" @click="openAddField">+ 添加字段</el-button>
            <el-button type="success" @click="openBindRelation">+ 新建/绑定关联表</el-button>
          </div>

          <table-block :info="schema.Master" @config="openFieldConfig"></table-block>
          <table-block v-for="t in schema.Details" :key="t.TableName" :info="t" @config="openFieldConfig" @unbind="unbindRelation(t)"></table-block>
          <table-block v-for="t in schema.Extensions" :key="t.TableName" :info="t" @config="openFieldConfig" @unbind="unbindRelation(t)"></table-block>
        </template>
        <el-empty v-else description="请选择左侧文档查看结构" />
      </div>
    </div>

    <!-- 添加字段对话框 -->
    <el-dialog v-model="addVisible" title="添加字段" width="520px">
      <el-form :model="form" label-width="92px">
        <el-form-item label="合并到">
          <el-select v-model="form.TargetTable" style="width:100%">
            <el-option-group label="主表">
              <el-option :label="schema.Master.Label + ' (' + schema.Master.TableName + ')'"
                         :value="schema.Master.TableName" v-if="schema" />
            </el-option-group>
            <el-option-group label="明细表" v-if="schema && schema.Details.length">
              <el-option v-for="t in schema.Details" :key="t.TableName"
                         :label="t.Label + ' (' + t.TableName + ')'" :value="t.TableName" />
            </el-option-group>
            <el-option-group label="扩展表" v-if="schema && schema.Extensions.length">
              <el-option v-for="t in schema.Extensions" :key="t.TableName"
                         :label="t.Label + ' (' + t.TableName + ')'" :value="t.TableName" />
            </el-option-group>
          </el-select>
        </el-form-item>
        <el-form-item label="字段名">
          <el-input v-model="form.FieldName" placeholder="字母/数字/下划线，如 CustomCode" />
        </el-form-item>
        <el-form-item label="显示名">
          <el-input v-model="form.Label" placeholder="字段注释" />
        </el-form-item>
        <el-form-item label="类型">
          <el-select v-model="form.DataType" style="width:100%">
            <el-option v-for="t in dataTypes" :key="t" :label="t" :value="t" />
          </el-select>
        </el-form-item>
        <el-form-item label="长度" v-if="form.DataType === 'string'">
          <el-input-number v-model="form.Length" :min="1" :max="8000" />
        </el-form-item>
        <el-form-item label="原始类型" v-if="form.DataType === 'raw'">
          <el-input v-model="form.RawType" placeholder="如 decimal(18,2)" />
        </el-form-item>
        <el-form-item label="必填">
          <el-switch v-model="form.NotNull" />
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="addVisible = false">取消</el-button>
        <el-button type="primary" :loading="submitting" @click="submitAddField">确定</el-button>
      </template>
    </el-dialog>

    <!-- 新建/绑定关联表对话框 -->
    <el-dialog v-model="bindVisible" title="新建 / 绑定关联表" width="500px">
      <el-form :model="bindForm" label-width="100px">
        <el-form-item label="关联类型">
          <el-radio-group v-model="bindForm.RelationType">
            <el-radio value="Extension">扩展表（1:1，共享主单 Id）</el-radio>
            <el-radio value="Detail">明细表（1:N）</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="关联表名">
          <el-input v-model="bindForm.RelationTable" placeholder="如 erp_sales_order_ext2" />
          <div style="font-size:12px;color:#909399;margin-top:4px">
            若表不存在，保存后在「添加字段」时会自动建表
          </div>
        </el-form-item>
        <el-form-item label="显示名称">
          <el-input v-model="bindForm.Label" placeholder="如 发票信息" />
        </el-form-item>
        <el-form-item label="外键列名" v-if="bindForm.RelationType === 'Detail'">
          <el-input v-model="bindForm.ForeignKey" placeholder="如 OrderId" />
        </el-form-item>
        <el-form-item label="集合属性名" v-if="bindForm.RelationType === 'Detail'">
          <el-input v-model="bindForm.PropertyName" placeholder="留空则与表名相同" />
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="bindVisible = false">取消</el-button>
        <el-button type="primary" :loading="binding" @click="submitBind">确认绑定</el-button>
      </template>
    </el-dialog>

    <!-- 字段配置对话框 -->
    <el-dialog v-model="configVisible" :title="'字段配置：' + (configTable && configTable.TableName)" width="1100px" top="5vh" :close-on-click-modal="false">
      <div style="margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <el-button type="primary" size="small" @click="addVirtualField">+ 新增虚拟字段</el-button>
        <el-button type="success" size="small" :loading="configSaving" @click="saveFieldConfigs">保存全部变更</el-button>
        <el-divider direction="vertical" />
        <el-button size="small" @click="exportFieldConfigs">导出配置 JSON</el-button>
        <el-upload :show-file-list="false" accept=".json" :before-upload="importFieldConfigs" style="display:inline-block">
          <el-button size="small" type="warning" :loading="importing">导入配置 JSON</el-button>
        </el-upload>
        <span style="font-size:12px;color:#909399">导出/导入可用于跨环境迁移字段配置</span>
        <el-button size="small" @click="configVisible = false" style="margin-left:auto">关闭</el-button>
      </div>
      <el-table :data="fieldConfigs" size="small" border v-loading="configLoading" height="55vh">
        <el-table-column prop="Name" label="字段名" width="160">
          <template #default="s">
            <el-input v-if="!s.row.PhysicalExists" v-model="s.row.Name" size="small" placeholder="新字段名" />
            <span v-else>{{ s.row.Name }}</span>
          </template>
        </el-table-column>
        <el-table-column label="来源" width="90">
          <template #default="s">{{ s.row.PhysicalExists ? '物理列' : (s.row.SourceType || 'Virtual') }}</template>
        </el-table-column>
        <el-table-column prop="DataType" label="物理类型" width="120" />
        <el-table-column label="描述" width="140">
          <template #default="s"><el-input v-model="s.row.Description" size="small" placeholder="显示名" /></template>
        </el-table-column>
        <el-table-column label="语言ID" width="120">
          <template #default="s"><el-input v-model="s.row.LangId" size="small" placeholder="多语言Key" /></template>
        </el-table-column>
        <el-table-column label="逻辑类型" width="120">
          <template #default="s">
            <el-select v-model="s.row.FieldType" size="small" style="width:100%">
              <el-option v-for="t in fieldTypes" :key="t" :label="t" :value="t" />
            </el-select>
          </template>
        </el-table-column>
        <el-table-column label="来源类型" width="120">
          <template #default="s">
            <el-select v-model="s.row.SourceType" size="small" style="width:100%">
              <el-option v-for="t in sourceTypes" :key="t" :label="t" :value="t" />
            </el-select>
          </template>
        </el-table-column>
        <el-table-column label="组件" width="130">
          <template #default="s">
            <el-select v-model="s.row.Component" size="small" style="width:100%">
              <el-option v-for="t in components" :key="t" :label="t" :value="t" />
            </el-select>
          </template>
        </el-table-column>
        <el-table-column label="排序" width="90">
          <template #default="s"><el-input-number v-model="s.row.SortNo" size="small" :min="0" style="width:80px" /></template>
        </el-table-column>
        <el-table-column label="更新" width="70">
          <template #default="s"><el-switch v-model="s.row.IsUpdate" /></template>
        </el-table-column>
        <el-table-column label="隐藏" width="70">
          <template #default="s"><el-switch v-model="s.row.ForceHidden" /></template>
        </el-table-column>
        <el-table-column label="默认显示" width="80">
          <template #default="s"><el-switch v-model="s.row.DefaultVisible" /></template>
        </el-table-column>
        <el-table-column label="必填" width="70">
          <template #default="s"><el-switch v-model="s.row.Required" /></template>
        </el-table-column>
        <el-table-column label="主键" width="70">
          <template #default="s"><el-switch v-model="s.row.IsPrimaryKey" /></template>
        </el-table-column>
        <el-table-column label="操作" width="90" fixed="right">
          <template #default="s">
            <el-button v-if="s.row.HasConfig || !s.row.PhysicalExists" type="danger" size="small" link @click="deleteFieldConfig(s.row)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
    </el-dialog>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script>
    const { createApp, ref, reactive, onMounted } = Vue;

    const TableBlock = {
      props: ['info'],
      emits: ['config', 'unbind'],
      template: `
        <el-card class="table-card" shadow="never">
          <template #header>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <b>{{ info.Label }}</b>
                <span class="muted" style="font-size:12px"> {{ info.TableName }}</span>
                <el-tag size="small" class="role-tag" :type="roleType">{{ roleText }}</el-tag>
                <el-tag size="small" class="role-tag" v-if="info.ForeignKey" type="info">外键: {{ info.ForeignKey }}</el-tag>
                <el-tag size="small" class="role-tag" v-if="!info.Exists" type="warning">未建表</el-tag>
                <el-tag size="small" class="role-tag" v-if="info.IsDynamic" type="success">动态绑定</el-tag>
              </div>
              <div style="display:flex;gap:8px">
                <el-button size="small" @click="$emit('config', info)">字段配置</el-button>
                <el-popconfirm v-if="info.IsDynamic" title="确认解除绑定？主表数据不受影响。" @confirm="$emit('unbind', info)">
                  <template #reference><el-button size="small" type="danger" plain>解绑</el-button></template>
                </el-popconfirm>
              </div>
            </div>
          </template>
          <el-table :data="info.Columns" size="small" border>
            <el-table-column prop="Name" label="字段名" width="200">
              <template #default="s">
                {{ s.row.Name }}
                <el-tag v-if="s.row.IsPrimaryKey" size="small" type="danger">PK</el-tag>
                <el-tag v-if="s.row.IsSystem" size="small" type="info">系统</el-tag>
              </template>
            </el-table-column>
            <el-table-column prop="ColumnType" label="类型" width="180" />
            <el-table-column label="可空" width="70">
              <template #default="s">{{ s.row.Nullable ? '是' : '否' }}</template>
            </el-table-column>
            <el-table-column prop="Comment" label="注释" />
          </el-table>
          <el-empty v-if="!info.Columns || info.Columns.length === 0" description="无列或表未创建" :image-size="50" />
        </el-card>`,
      computed: {
        roleText() { return { 0: '主表', 1: '明细表', 2: '扩展表' }[this.info.Role]; },
        roleType() { return { 0: 'primary', 1: 'success', 2: 'warning' }[this.info.Role] || 'info'; }
      }
    };

    createApp({
      components: { TableBlock },
      setup() {
        /* ── 业务底座独立登录（bizadmin） ────────────────────────────── */
        const bizToken  = ref('');
        const bizOsClient = ref('');

        function initBizAuth() {
          // 优先从 URL 参数（登录页跳转携带），其次 localStorage
          const q = new URLSearchParams(location.search);
          const t  = q.get('biz_token')  || localStorage.getItem('biz_admin_token') || '';
          const oc = q.get('biz_client') || localStorage.getItem('biz_client') || '';
          if (t) {
            bizToken.value = t; bizOsClient.value = oc;
            localStorage.setItem('biz_admin_token', t);
            localStorage.setItem('biz_client', oc);
            // 清理 URL 参数（避免刷新重复提交）
            if (q.has('biz_token')) history.replaceState({}, '', location.pathname);
          }
        }

        async function verifyBizToken() {
          if (!bizToken.value) return false;
          try {
            const r = await fetch('/api/BusinessAuth/Verify', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ OsClient: bizOsClient.value, Token: bizToken.value })
            }).then(x => x.json());
            if (r?.Code !== 1) { bizToken.value = ''; localStorage.removeItem('biz_admin_token'); return false; }
            return true;
          } catch { return false; }
        }

        function gotoLogin() {
          localStorage.removeItem('biz_admin_token');
          location.href = 'business-login.html?redirect=' + encodeURIComponent('business-schema.html');
        }

        function gotoDocument() {
          const t = bizToken.value;
          const oc = bizOsClient.value;
          if (t) {
            location.href = `business-document.html?biz_token=${encodeURIComponent(t)}&biz_client=${encodeURIComponent(oc)}`;
          } else {
            location.href = 'business-document.html';
          }
        }

        /* ── Microi Token（用于 BusinessSchema API）─────────────────── */
        const token = ref(localStorage.getItem('microi_biz_token') || '');
        const osClient = ref(localStorage.getItem('microi_biz_osclient') || '');
        const documents = ref([]);
        const schema = ref(null);
        const current = ref(null);
        const loading = ref(false);
        const addVisible = ref(false);
        const submitting = ref(false);
        const dataTypes = ['string', 'text', 'int', 'long', 'decimal', 'double', 'bool', 'datetime', 'raw'];
        const form = reactive({ TargetTable: '', FieldName: '', Label: '', DataType: 'string', Length: 255, RawType: '', NotNull: false });
        const fieldTypes = ['string', 'text', 'int', 'long', 'decimal', 'double', 'bool', 'datetime', 'raw'];
        const sourceTypes = ['Physical', 'Virtual', 'Relation', 'Formula'];
        const components = ['Text', 'Textarea', 'NumberText', 'Select', 'MultiSelect', 'DatePicker', 'DateTimePicker', 'Switch', 'Radio', 'Checkbox', 'Upload', 'Editor'];
        const configVisible = ref(false);
        const configLoading = ref(false);
        const configSaving = ref(false);
        const importing = ref(false);
        const configTable = ref(null);
        const fieldConfigs = ref([]);

        async function api(action, body) {
          const res = await fetch('/api/BusinessSchema/' + action, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': token.value },
            body: JSON.stringify(Object.assign({ OsClient: osClient.value }, body || {}))
          });
          return await res.json();
        }

        async function loadDocuments() {
          localStorage.setItem('microi_biz_token', token.value);
          localStorage.setItem('microi_biz_osclient', osClient.value);
          loading.value = true;
          try {
            const r = await api('GetDocuments');
            if (r && r.Code === 1) { documents.value = r.Data || []; }
            else { ElementPlus.ElMessage.error(r && r.Msg || '加载失败'); }
          } catch (e) { ElementPlus.ElMessage.error('请求失败: ' + e.message); }
          finally { loading.value = false; }
        }

        async function openDocument(masterTable) {
          loading.value = true;
          try {
            const r = await api('GetDocumentSchema', { MasterTable: masterTable });
            if (r && r.Code === 1) { schema.value = r.Data; current.value = r.Data; }
            else { ElementPlus.ElMessage.error(r && r.Msg || '加载结构失败'); }
          } finally { loading.value = false; }
        }

        function openAddField() {
          if (!schema.value) return;
          form.TargetTable = schema.value.Master.TableName;
          form.FieldName = ''; form.Label = ''; form.DataType = 'string';
          form.Length = 255; form.RawType = ''; form.NotNull = false;
          addVisible.value = true;
        }

        async function submitAddField() {
          if (!form.FieldName) { ElementPlus.ElMessage.warning('请输入字段名'); return; }
          submitting.value = true;
          try {
            const r = await api('AddField', {
              MasterTable: schema.value.MasterTable,
              TargetTable: form.TargetTable,
              FieldName: form.FieldName,
              Label: form.Label,
              DataType: form.DataType,
              Length: form.Length,
              RawType: form.RawType,
              NotNull: form.NotNull
            });
            if (r && r.Code === 1) {
              ElementPlus.ElMessage.success(r.Msg || '添加成功');
              addVisible.value = false;
              await openDocument(schema.value.MasterTable);
            } else {
              ElementPlus.ElMessage.error(r && r.Msg || '添加失败');
            }
          } finally { submitting.value = false; }
        }

        async function openFieldConfig(info) {
          configTable.value = info;
          configVisible.value = true;
          configLoading.value = true;
          try {
            const r = await api('GetFieldConfigs', { TableName: info.TableName });
            if (r && r.Code === 1) {
              fieldConfigs.value = (r.Data || []).map(x => ({ ...x }));
            } else {
              ElementPlus.ElMessage.error(r && r.Msg || '加载字段配置失败');
            }
          } catch (e) { ElementPlus.ElMessage.error('请求失败: ' + e.message); }
          finally { configLoading.value = false; }
        }

        function addVirtualField() {
          fieldConfigs.value.push({
            Name: '', PhysicalExists: false, DataType: '', ColumnType: '', PhysicalComment: '', IsSystem: false,
            ConfigId: '', HasConfig: true, Description: '', LangId: '', FieldType: 'string', SourceType: 'Virtual',
            Component: 'Text', IsPrimaryKey: false, IsUpdate: true, ForceHidden: false, DefaultVisible: true, Required: false, SortNo: 0
          });
        }

        async function saveFieldConfigs() {
          const tableName = configTable.value && configTable.value.TableName;
          if (!tableName) return;
          const fields = fieldConfigs.value.map(x => ({
            FieldName: x.Name,
            Description: x.Description,
            LangId: x.LangId,
            FieldType: x.FieldType,
            SourceType: x.SourceType,
            Component: x.Component,
            IsPrimaryKey: !!x.IsPrimaryKey,
            IsUpdate: !!x.IsUpdate,
            ForceHidden: !!x.ForceHidden,
            DefaultVisible: !!x.DefaultVisible,
            Required: !!x.Required,
            SortNo: x.SortNo || 0
          })).filter(x => x.FieldName);

          if (fields.length === 0) { ElementPlus.ElMessage.warning('没有可保存的字段'); return; }
          configSaving.value = true;
          try {
            const r = await api('SaveFieldConfigs', { TableName: tableName, Fields: fields });
            if (r && r.Code === 1) {
              ElementPlus.ElMessage.success(r.Msg || '保存成功');
              // 刷新字段配置面板 + 联动刷新左侧文档列表
              await Promise.all([
                openFieldConfig(configTable.value),
                loadDocuments()
              ]);
            } else {
              ElementPlus.ElMessage.error(r && r.Msg || '保存失败');
            }
          } catch (e) { ElementPlus.ElMessage.error('请求失败: ' + e.message); }
          finally { configSaving.value = false; }
        }

        function exportFieldConfigs() {
          const tableName = configTable.value && configTable.value.TableName;
          if (!tableName) return;
          // 仅导出有配置 ID 的字段（已保存到 business_field_config 的条目）
          const toExport = fieldConfigs.value
            .filter(x => x.HasConfig || !x.PhysicalExists)
            .map(x => ({
              TableName: tableName,
              FieldName: x.Name,
              Description: x.Description,
              LangId: x.LangId,
              FieldType: x.FieldType,
              SourceType: x.SourceType,
              Component: x.Component,
              IsPrimaryKey: !!x.IsPrimaryKey,
              IsUpdate: !!x.IsUpdate,
              ForceHidden: !!x.ForceHidden,
              DefaultVisible: !!x.DefaultVisible,
              Required: !!x.Required,
              SortNo: x.SortNo || 0
            }));
          const blob = new Blob([JSON.stringify(toExport, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `field-config-${tableName}-${new Date().toISOString().slice(0,10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
          ElementPlus.ElMessage.success(`已导出 ${toExport.length} 条字段配置`);
        }

        async function importFieldConfigs(file) {
          importing.value = true;
          try {
            const text = await file.text();
            let configs;
            try { configs = JSON.parse(text); } catch { ElementPlus.ElMessage.error('JSON 格式错误'); return false; }
            if (!Array.isArray(configs) || configs.length === 0) {
              ElementPlus.ElMessage.warning('导入列表为空或格式不正确');
              return false;
            }
            const r = await api('ImportFieldConfigs', { Configs: configs });
            if (r && r.Code === 1) {
              ElementPlus.ElMessage.success(r.Msg || '导入成功');
              await Promise.all([openFieldConfig(configTable.value), loadDocuments()]);
            } else {
              ElementPlus.ElMessage.error(r && r.Msg || '导入失败');
            }
          } catch (e) { ElementPlus.ElMessage.error('导入异常: ' + e.message); }
          finally { importing.value = false; }
          return false; // 阻止 el-upload 默认上传行为
        }

        async function deleteFieldConfig(row) {
          const tableName = configTable.value && configTable.value.TableName;
          if (!tableName || !row.Name) return;
          if (row.PhysicalExists) {
            const r = await api('DeleteFieldConfig', { TableName: tableName, FieldName: row.Name });
            if (r && r.Code === 1) {
              ElementPlus.ElMessage.success(r.Msg || '删除成功');
              await openFieldConfig(configTable.value);
            } else {
              ElementPlus.ElMessage.error(r && r.Msg || '删除失败');
            }
          } else {
            const idx = fieldConfigs.value.indexOf(row);
            if (idx >= 0) fieldConfigs.value.splice(idx, 1);
          }
        }

        /* ── 绑定/解绑关联表 ────────────────────────────────────────── */
        const bindVisible = ref(false);
        const binding = ref(false);
        const bindForm = reactive({
          RelationType: 'Extension', RelationTable: '', Label: '', ForeignKey: '', PropertyName: ''
        });

        function openBindRelation() {
          bindForm.RelationType = 'Extension';
          bindForm.RelationTable = '';
          bindForm.Label = '';
          bindForm.ForeignKey = '';
          bindForm.PropertyName = '';
          bindVisible.value = true;
        }

        async function submitBind() {
          if (!bindForm.RelationTable) { ElementPlus.ElMessage.warning('请输入关联表名'); return; }
          if (bindForm.RelationType === 'Detail' && !bindForm.ForeignKey) {
            ElementPlus.ElMessage.warning('明细表必须填写外键列名'); return;
          }
          binding.value = true;
          try {
            const r = await api('BindRelation', {
              MasterTable: schema.value.MasterTable,
              RelationTable: bindForm.RelationTable,
              RelationType: bindForm.RelationType,
              Label: bindForm.Label,
              ForeignKey: bindForm.ForeignKey,
              PropertyName: bindForm.PropertyName
            });
            if (r && r.Code === 1) {
              ElementPlus.ElMessage.success(r.Msg || '绑定成功');
              bindVisible.value = false;
              await openDocument(schema.value.MasterTable);
              await loadDocuments();
            } else {
              ElementPlus.ElMessage.error(r && r.Msg || '绑定失败');
            }
          } catch (e) { ElementPlus.ElMessage.error('请求失败: ' + e.message); }
          finally { binding.value = false; }
        }

        async function unbindRelation(tableInfo) {
          if (!tableInfo.RelationId) { ElementPlus.ElMessage.warning('静态关系不可解绑（需修改 C# 代码）'); return; }
          try {
            const r = await api('UnbindRelation', {
              RelationId: tableInfo.RelationId,
              MasterTable: schema.value.MasterTable
            });
            if (r && r.Code === 1) {
              ElementPlus.ElMessage.success('已解除绑定');
              await openDocument(schema.value.MasterTable);
              await loadDocuments();
            } else {
              ElementPlus.ElMessage.error(r && r.Msg || '解绑失败');
            }
          } catch (e) { ElementPlus.ElMessage.error('请求失败: ' + e.message); }
        }

        /* ── 初始化：bizadmin 鉴权 ──────────────────────────────────── */
        onMounted(async () => {
          initBizAuth();
          if (bizToken.value) {
            const valid = await verifyBizToken();
            if (!valid) {
              ElementPlus.ElMessage.warning('登录已过期，请重新登录');
              setTimeout(gotoLogin, 1500);
              return;
            }
            // 用 bizOsClient 同步 osClient（业务 API 用的租户）
            if (bizOsClient.value) osClient.value = bizOsClient.value;
          }
          if (token.value) loadDocuments();
        });

        return { token, osClient, bizToken, bizOsClient,
          documents, schema, current, loading, addVisible, submitting,
          dataTypes, form, fieldTypes, sourceTypes, components,
          configVisible, configLoading, configSaving, importing, configTable, fieldConfigs,
          bindVisible, binding, bindForm,
          gotoLogin, gotoDocument,
          loadDocuments, openDocument, openAddField, submitAddField,
          openFieldConfig, addVirtualField, saveFieldConfigs, deleteFieldConfig,
          exportFieldConfigs, importFieldConfigs,
          openBindRelation, submitBind, unbindRelation };
      }
    }).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
